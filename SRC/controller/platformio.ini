[platformio]
; 工程路径含中文时，XTensa ld 无法写 map 文件；把构建目录放到纯 ASCII 路径。
build_dir = C:/pio-build/smt_feeder_controller

; ============================================================
;  SMT 飞达控制器  —  PlatformIO (VSCode) 工程配置
;  板卡: ESP32-WROOM-32E
;  串口: UART0 + CH340C(USB)  /  UART1 + MAX485(485 总线)
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 4MB flash, OTA 双分区(app0/app1 各1.75MB) + 448KB 文件系统
; default_ota.csv 在工程根目录(框架包不随附该文件，放工程内保证可编译)
board_build.flash_size = 4MB
board_build.partitions = default_ota.csv

; Web 页面存文件系统(data/)，与固件分离，改页面不用重编固件
; 上传文件系统:
;   VSCode: PlatformIO -> esp32dev -> Upload Filesystem Image
;   命令行: pio run -t uploadfs
board_build.filesystem = littlefs

; 零第三方依赖: Web 服务器用 ESP32 官方核心内置 WebServer
; (不再需要 ESPAsyncWebServer/AsyncTCP，避免库注册表拉取失败)
; 唯一第三方库: espSoftwareSerial(串口屏软串口后端) —— 注册表拉取在本机常失败,
; 已手动放入工程 lib/espSoftwareSerial(从 github plerup/espSoftwareSerial master 解压)

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHTTPCLIENT_1_1_COMPATIBLE

; 编译期注入固件版本/仓库（也可在 config.h 里改，这里优先级最高）
; build_flags =
;     -DFW_VERSION='"1.0.0"'
;     -DFW_GITHUB_OWNER='"your_owner"'
;     -DFW_GITHUB_REPO='"your_repo"'

; 版本号: pre 生成(gen_version.py, 读当前序号) + post 递增(bump_seq.py, 每次 pio 调用 +1)
; 页面版本: pre 生成(gen_fsver.py, data/ 内容哈希 -> data/fsver.txt, 页面变了版本才变)
; 发布包: firmware/littlefs 构建完成后自动打包(package_bins.py)
; 产物: dist/DDfeeder<YYYYMMDD+2位序号>_{full,ota}.bin + DDfs<页面版本>.bin
extra_scripts =
    pre:scripts/gen_version.py
    pre:scripts/gen_fsver.py
    pre:scripts/package_bins.py
    post:scripts/bump_seq.py
